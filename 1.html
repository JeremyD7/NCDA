<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NCDA Demo</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        background: white;
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        text-align: center;
        max-width: 400px;
        width: 90%;
        transition: transform 0.3s ease;
      }
      .card:hover { transform: translateY(-5px); }
      .card h1 {
        color: #333;
        font-size: 2rem;
        margin-bottom: 12px;
      }
      .card p { color: #666; margin-bottom: 24px; line-height: 1.6; }
      .btn {
        display: inline-block;
        padding: 12px 32px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 30px;
        font-size: 1rem;
        cursor: pointer;
        transition: opacity 0.3s ease, transform 0.2s ease;
      }
      .btn:hover { opacity: 0.9; transform: scale(1.05); }
      .counter {
        font-size: 3rem;
        font-weight: bold;
        color: #764ba2;
        margin: 16px 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🎨 NCDA Demo</h1>
      <p>点击按钮增加计数，来试试看吧！</p>
      <div class="counter" id="counter">0</div>
      <button class="btn" id="clickBtn">点我 +1</button>
    </div>

    <script>
      (function () {
        const counterEl = document.getElementById('counter');
        const btnEl = document.getElementById('clickBtn');
        let count = 0;

        btnEl.addEventListener('click', () => {
          count += 1;
          counterEl.textContent = count;

          // 当计数达到特定值时给点彩蛋
          if (count % 10 === 0) {
            counterEl.style.color = count % 20 === 0 ? '#764ba2' : '#e74c3c';
          }
        });

        console.log('🎉 NCDA Demo 页面已加载！');
      })();
    </script>
  </body>
</html>
