<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌦️ 随机天气小工具</title>
    <style>
      :root {
        --bg: #1a1a2e;
        --card-bg: #16213e;
        --text: #eee;
        --accent: #e94560;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .widget {
        background: var(--card-bg);
        border-radius: 24px;
        padding: 36px 48px;
        text-align: center;
        box-shadow: 0 15px 50px rgba(0,0,0,0.5);
        min-width: 320px;
      }
      .widget .city {
        font-size: 1.4rem;
        color: #aaa;
        margin-bottom: 6px;
      }
      .widget .temp {
        font-size: 5rem;
        font-weight: 800;
        background: linear-gradient(180deg, #fff 30%, #e94560);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .widget .desc {
        font-size: 1.2rem;
        color: #ccc;
        margin: 8px 0 20px;
      }
      .details {
        display: flex;
        justify-content: space-around;
        margin: 24px 0;
        gap: 20px;
      }
      .details .item span {
        display: block;
        font-size: 0.85rem;
        color: #888;
        margin-top: 4px;
      }
      .details .item strong { font-size: 1.3rem; }
      .refresh-btn {
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 10px 28px;
        border-radius: 50px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 8px;
      }
      .refresh-btn:hover {
        background: #ff6b81;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(233, 69, 96, 0.4);
      }
      .loading { opacity: 0.5; pointer-events: none; }
    </style>
  </head>
  <body>
    <div class="widget" id="weatherWidget">
      <div class="city" id="city">📍 北京</div>
      <div class="temp" id="temp">26°</div>
      <div class="desc" id="desc">⛅ 多云</div>
      <div class="details">
        <div class="item">
          <strong id="humidity">65%</strong>
          <span>💧 湿度</span>
        </div>
        <div class="item">
          <strong id="wind">12 km/h</strong>
          <span>🌬️ 风速</span>
        </div>
        <div class="item">
          <strong id="uv">4</strong>
          <span>☀️ 紫外线</span>
        </div>
      </div>
      <button class="refresh-btn" id="refreshBtn">🔄 刷新天气</button>
    </div>

    <script>
      (function () {
        const cities = ['北京', '上海', '广州', '深圳', '成都', '杭州', '武汉', '南京'];
        const weathers = [
          { desc: '☀️ 晴朗', icon: '☀️' },
          { desc: '⛅ 多云', icon: '⛅' },
          { desc: '🌧️ 小雨', icon: '🌧️' },
          { desc: '⛈️ 雷阵雨', icon: '⛈️' },
          { desc: '🌫️ 雾霾', icon: '🌫️' },
          { desc: '❄️ 小雪', icon: '❄️' },
        ];

        function rand(min, max) {
          return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function pick(arr) {
          return arr[Math.floor(Math.random() * arr.length)];
        }

        function refreshWeather() {
          const widget = document.getElementById('weatherWidget');
          widget.classList.add('loading');

          // 模拟网络延迟
          setTimeout(() => {
            const w = pick(weathers);
            const temp = rand(10, 40);
            document.getElementById('city').textContent = '📍 ' + pick(cities);
            document.getElementById('temp').textContent = temp + '°';
            document.getElementById('desc').textContent = w.desc;
            document.getElementById('humidity').textContent = rand(30, 95) + '%';
            document.getElementById('wind').textContent = rand(3, 35) + ' km/h';
            document.getElementById('uv').textContent = rand(1, 11);
            widget.classList.remove('loading');

            console.log(
              '%c🌦️ 天气已更新 %c| %c' +
                document.getElementById('city').textContent +
                ' %c' + temp + '° ' + w.desc,
              'font-size:14px;', '', 'color:#e94560;', 'color:#fff;'
            );
          }, 600);
        }

        document.getElementById('refreshBtn').addEventListener('click', refreshWeather);

        // 页面加载时记录
        console.log('%c🌦️ 随机天气小工具已就绪', 'color:#e94560;font-size:14px;');
      })();
    </script>
  </body>
</html>
