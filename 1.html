<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎮 猜数字小游戏</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Courier New', Courier, monospace;
        background: #0f0f23;
        color: #ff6ec7;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .game-box {
        background: #1a1a3e;
        border: 2px solid #ff6ec7;
        border-radius: 20px;
        padding: 48px 40px;
        text-align: center;
        max-width: 440px;
        width: 90%;
        box-shadow: 0 0 40px rgba(255, 110, 199, 0.15);
      }
      .game-box h1 {
        font-size: 2rem;
        margin-bottom: 6px;
        text-shadow: 0 0 10px rgba(255, 110, 199, 0.6);
      }
      .subtitle {
        color: #7a7acc;
        font-size: 0.9rem;
        margin-bottom: 28px;
      }
      .hint {
        background: #0f0f23;
        border: 1px dashed #ff6ec7;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 20px;
        font-size: 1.2rem;
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }
      .hint.success {
        border-color: #00e676;
        color: #00e676;
        background: #0a2a1a;
        box-shadow: 0 0 30px rgba(0, 230, 118, 0.2);
      }
      .hint.fail {
        border-color: #ff1744;
        color: #ff1744;
      }
      .guesses {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-bottom: 20px;
        min-height: 32px;
      }
      .guesses span {
        display: inline-block;
        width: 36px;
        height: 36px;
        line-height: 36px;
        border-radius: 50%;
        font-weight: bold;
        font-size: 0.95rem;
      }
      .guesses .too-high { background: #ff174422; color: #ff1744; border: 1px solid #ff1744; }
      .guesses .too-low  { background: #2979ff22; color: #2979ff; border: 1px solid #2979ff; }
      .guesses .correct  { background: #00e67622; color: #00e676; border: 1px solid #00e676; }
      .input-row {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }
      .input-row input {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid #ff6ec7;
        border-radius: 30px;
        background: #0f0f23;
        color: #fff;
        font-size: 1.1rem;
        text-align: center;
        font-family: inherit;
        outline: none;
        transition: border-color 0.3s;
      }
      .input-row input:focus { border-color: #ff9de0; }
      .input-row button {
        padding: 12px 28px;
        border: none;
        border-radius: 30px;
        background: #ff6ec7;
        color: #0f0f23;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.2s ease;
      }
      .input-row button:hover {
        background: #ff9de0;
        transform: scale(1.04);
      }
      .new-game-btn {
        background: transparent;
        border: 2px solid #7a7acc;
        color: #7a7acc;
        padding: 10px 24px;
        border-radius: 30px;
        font-size: 0.9rem;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.2s ease;
      }
      .new-game-btn:hover {
        background: #7a7acc22;
        border-color: #ff6ec7;
        color: #ff6ec7;
      }
      .stats {
        color: #7a7acc;
        font-size: 0.85rem;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="game-box">
      <h1>🎮 猜数字</h1>
      <p class="subtitle">请输入 1 ~ 100 之间的数字</p>
      <div class="hint" id="hint">🤔 让我们开始吧！</div>
      <div class="guesses" id="guesses"></div>
      <div class="input-row">
        <input type="number" id="guessInput" min="1" max="100" placeholder="1-100" />
        <button id="submitBtn">🎯 猜测</button>
      </div>
      <button class="new-game-btn" id="newGameBtn">🔄 新游戏</button>
      <div class="stats" id="stats"></div>
    </div>

    <script>
      (function () {
        const hintEl = document.getElementById('hint');
        const guessesEl = document.getElementById('guesses');
        const inputEl = document.getElementById('guessInput');
        const submitBtn = document.getElementById('submitBtn');
        const newGameBtn = document.getElementById('newGameBtn');
        const statsEl = document.getElementById('stats');

        let target = 0;
        let attempts = 0;
        let history = [];
        let gameOver = false;

        function newGame() {
          target = Math.floor(Math.random() * 100) + 1;
          attempts = 0;
          history = [];
          gameOver = false;
          hintEl.textContent = '🤔 让我们开始吧！';
          hintEl.className = 'hint';
          guessesEl.innerHTML = '';
          inputEl.value = '';
          inputEl.disabled = false;
          submitBtn.disabled = false;
          statsEl.textContent = '';
          inputEl.focus();
          console.log('%c🎮 新游戏开始！目标数字已生成（嘘~ 是 ' + target + '）', 'color:#ff6ec7;');
        }

        function renderHistory() {
          guessesEl.innerHTML = history
            .map((g) => {
              let cls = '';
              if (g === target) cls = 'correct';
              else if (g > target) cls = 'too-high';
              else cls = 'too-low';
              return '<span class="' + cls + '">' + g + '</span>';
            })
            .join('');
        }

        function makeGuess() {
          if (gameOver) return;
          const val = parseInt(inputEl.value, 10);
          if (isNaN(val) || val < 1 || val > 100) {
            hintEl.textContent = '⚠️ 请输入 1 到 100 之间的整数！';
            hintEl.className = 'hint fail';
            inputEl.value = '';
            return;
          }
          attempts++;
          history.push(val);
          renderHistory();

          if (val === target) {
            hintEl.textContent = '🎉 恭喜！你猜对了！答案就是 ' + target + '！';
            hintEl.className = 'hint success';
            gameOver = true;
            inputEl.disabled = true;
            submitBtn.disabled = true;
            statsEl.textContent = '🏆 你一共用了 ' + attempts + ' 次猜测';
          } else if (val > target) {
            hintEl.textContent = '📉 太大了，再小一点！';
            hintEl.className = 'hint fail';
          } else {
            hintEl.textContent = '📈 太小了，再大一点！';
            hintEl.className = 'hint fail';
          }
          inputEl.value = '';
          inputEl.focus();
        }

        submitBtn.addEventListener('click', makeGuess);
        inputEl.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') makeGuess();
        });
        newGameBtn.addEventListener('click', newGame);

        newGame();
      })();
    </script>
  </body>
</html>
