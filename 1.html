<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💡 随机名言卡片</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Georgia', '宋体', serif;
        background: #2d3436;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background 0.6s ease;
      }
      .card {
        background: #fff;
        border-radius: 16px;
        padding: 48px 40px;
        text-align: center;
        max-width: 460px;
        width: 90%;
        box-shadow: 0 16px 48px rgba(0,0,0,0.35);
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: '"';
        position: absolute;
        top: -10px;
        left: 16px;
        font-size: 10rem;
        color: rgba(0,0,0,0.04);
        font-family: Georgia, serif;
        line-height: 1;
      }
      .icon { font-size: 3rem; margin-bottom: 12px; }
      .quote {
        font-size: 1.4rem;
        color: #2d3436;
        line-height: 1.7;
        margin-bottom: 20px;
        min-height: 60px;
        transition: opacity 0.3s ease;
      }
      .author {
        font-size: 0.95rem;
        color: #b2bec3;
        margin-bottom: 28px;
      }
      .color-row {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-bottom: 20px;
      }
      .color-dot {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
        transition: transform 0.2s, border-color 0.2s;
      }
      .color-dot:hover { transform: scale(1.2); border-color: #2d3436; }
      .btn {
        padding: 12px 36px;
        border: none;
        border-radius: 50px;
        background: #2d3436;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
    </style>
  </head>
  <body id="body">
    <div class="card">
      <div class="icon" id="icon">💡</div>
      <div class="quote" id="quote">世界上只有一种真正的英雄主义，那就是在认清生活真相后依然热爱生活。</div>
      <div class="author" id="author">—— 罗曼·罗兰</div>
      <div class="color-row">
        <span class="color-dot" style="background:#2d3436" data-color="#2d3436"></span>
        <span class="color-dot" style="background:#6c5ce7" data-color="#6c5ce7"></span>
        <span class="color-dot" style="background:#0984e3" data-color="#0984e3"></span>
        <span class="color-dot" style="background:#00b894" data-color="#00b894"></span>
        <span class="color-dot" style="background:#d63031" data-color="#d63031"></span>
      </div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <button class="btn" id="nextBtn">🔄 换一条名言</button>
        <button class="btn" id="copyBtn" style="background:#636e72;">📋 复制</button>
      </div>
    </div>

    <script>
      (function () {
        const quotes = [
          { text: '世界上只有一种真正的英雄主义，那就是在认清生活真相后依然热爱生活。', author: '罗曼·罗兰', icon: '💡' },
          { text: '生活就像海洋，只有意志坚强的人，才能到达彼岸。', author: '马克思', icon: '🌊' },
          { text: '人生最终的价值在于觉醒和思考的能力，而不只在于生存。', author: '亚里士多德', icon: '🧠' },
          { text: '黑夜无论怎样悠长，白昼总会到来。', author: '莎士比亚', icon: '🌅' },
          { text: '学而不思则罔，思而不学则殆。', author: '孔子', icon: '📖' },
          { text: '天才是百分之一的灵感加百分之九十九的汗水。', author: '爱迪生', icon: '💪' },
          { text: '最困难的事情就是认识自己。', author: '泰勒斯', icon: '🪞' },
          { text: '业精于勤，荒于嬉；行成于思，毁于随。', author: '韩愈', icon: '🎯' },
        ];

        const quoteEl = document.getElementById('quote');
        const authorEl = document.getElementById('author');
        const iconEl = document.getElementById('icon');
        const bodyEl = document.getElementById('body');
        const nextBtn = document.getElementById('nextBtn');
        let lastIndex = 0;

        function pickQuote() {
          let idx;
          do { idx = Math.floor(Math.random() * quotes.length); } while (idx === lastIndex && quotes.length > 1);
          lastIndex = idx;
          const q = quotes[idx];
          quoteEl.textContent = q.text;
          authorEl.textContent = '—— ' + q.author;
          iconEl.textContent = q.icon;
          console.log('%c📜 名言: ' + q.text + ' ——' + q.author, 'color:#6c5ce7;');
        }

        nextBtn.addEventListener('click', pickQuote);

        // 一键复制名言
        document.getElementById('copyBtn').addEventListener('click', () => {
          const text = quoteEl.textContent + ' ' + authorEl.textContent;
          navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.textContent = '✅ 已复制';
            setTimeout(() => { btn.textContent = '📋 复制'; }, 1500);
          });
        });

        document.querySelectorAll('.color-dot').forEach(function (dot) {
          dot.addEventListener('click', function () {
            bodyEl.style.background = dot.dataset.color;
            console.log('%c🎨 背景色切换: ' + dot.dataset.color, 'color:' + dot.dataset.color + ';');
          });
        });

        console.log('%c💡 名言卡片已就绪，共 ' + quotes.length + ' 条名言', 'font-size:14px;color:#00b894;');
      })();
    </script>
  </body>
</html>
